<style>
/* ========== Tokens ========== */
:root{
  /* Surfaces, du fond vers le premier plan */
  --bg:#0f1114;--s1:#181b20;--s2:#22262d;--s3:#2d323b;--line:#2a2f37;--line2:#3a404a;
  /* Texte (contrastes ≥ 4,5:1 sur toutes les surfaces) */
  --tx:#f5f3ee;--tx2:#b6bcc6;--tx3:#9aa1ac;--on-acc:#14161a;
  /* Accent et états */
  --acc:#f0a63a;--acc2:#f7c46f;--acc-bg:#33260f;
  --ok:#4fd39c;--ok-bg:#12291f;--bad:#ff7a70;--bad-bg:#331614;
  --rest:#6aa8ff;--rest-bg:#142238;--dl:#5fd0e0;--dl-bg:#10282c;
  --blk:#5b9cf6; /* couleur du bloc en cours, posée par render() */
  /* Espacement */
  --sp1:4px;--sp2:8px;--sp3:12px;--sp4:16px;--sp5:24px;--sp6:32px;
  /* Rayons */
  --r1:8px;--r2:12px;--r3:16px;--r4:24px;--rf:999px;
  /* Typographie */
  --fs-xs:13px;--fs-s:15px;--fs-m:17px;--fs-l:20px;--fs-xl:24px;--fs-num:28px;--fs-big:44px;--fs-timer:64px;
  /* Mouvement */
  --d1:120ms;--d2:200ms;--d3:320ms;--ease:cubic-bezier(.2,.8,.2,1);--spring:cubic-bezier(.34,1.56,.64,1);
  /* Gabarit */
  --tap:48px;--maxw:560px;--tabbar-h:58px;--dock-h:90px;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
}

/* ========== Base ========== */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:var(--fs-m)/1.4 -apple-system,BlinkMacSystemFont,system-ui,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;border-radius:var(--r2);background:var(--s2);min-height:var(--tap);padding:0 var(--sp4);font-weight:700;touch-action:manipulation;transition:transform var(--d1) var(--ease)}
button:active{transform:scale(.96)}
:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.acc{background:var(--acc);color:var(--on-acc)}
input,select{background:var(--s2);border:1px solid var(--line2);border-radius:var(--r2);min-height:var(--tap);padding:0 var(--sp3);font-size:var(--fs-m)}
.tn{font-variant-numeric:tabular-nums}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ========== En-tête collant ========== */
#top{position:sticky;top:0;z-index:20;background:rgba(15,17,20,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:calc(var(--sat) + var(--sp2)) calc(var(--sar) + var(--sp4)) var(--sp2) calc(var(--sal) + var(--sp4))}
.top-in{max-width:var(--maxw);margin:0 auto;display:flex;align-items:center;gap:var(--sp2);min-height:36px}
.hweek{font-weight:800;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:6px;min-width:0;padding:5px 10px;border-radius:var(--rf);background:var(--s2);font-size:var(--fs-xs);font-weight:700;color:var(--tx)}
.chip>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--blk);flex:none}
.hprog{margin-left:auto;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.hprog small{font-size:var(--fs-xs);color:var(--tx2);font-weight:600;margin-left:3px}
.pbar{position:absolute;left:0;right:0;bottom:-1px;height:3px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--blk);transform-origin:0 50%;transform:scaleX(0);transition:transform var(--d3) var(--ease)}

/* ========== Contenu ========== */
main{max-width:var(--maxw);margin:0 auto;padding:var(--sp4) calc(var(--sar) + var(--sp4)) calc(var(--dock-h) + var(--sp5)) calc(var(--sal) + var(--sp4))}
.view[hidden]{display:none}

/* ========== Dock bas : minuteur + onglets ========== */
#dock{position:fixed;left:0;right:0;bottom:0;z-index:30}
.tabbar{display:flex;background:rgba(20,23,27,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:0 var(--sar) var(--sab) var(--sal)}
.tabbar button{flex:1;background:none;border-radius:0;min-height:var(--tabbar-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:var(--fs-xs);font-weight:600;color:var(--tx3);padding:6px 0}
.tabbar svg{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tabbar button[aria-current=page]{color:var(--acc)}
#timer{max-width:var(--maxw);margin:0 auto var(--sp2);padding:0 var(--sp3);display:flex;align-items:center;gap:var(--sp2)}
#timer:not(.run):not(.done){display:none}
#timer .t{flex:1;min-width:0;background:var(--s1);border:1px solid var(--line2);border-radius:var(--r3);padding:var(--sp2) var(--sp3);font-size:var(--fs-xl);font-weight:800;font-variant-numeric:tabular-nums}
#timer .t small{display:block;font-size:var(--fs-xs);font-weight:600;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#timer.done .t{background:var(--acc);color:var(--on-acc)}#timer.done .t small{color:var(--on-acc)}

/* ========== Anciennes vues (rebranchées sur les tokens) ========== */
.days{display:flex;gap:var(--sp2);margin-bottom:var(--sp3)}
.days button{flex:1;font-size:var(--fs-l);min-height:56px;line-height:1.1}
.days button small{display:block;font-size:var(--fs-xs);font-weight:600;opacity:.85}
.days button.on{background:var(--acc);color:var(--on-acc)}
.row{display:flex;gap:var(--sp2);align-items:center;margin-bottom:var(--sp3)}
input[type=number]{width:100%;text-align:center;font-size:var(--fs-l);font-weight:700;-moz-appearance:textfield}
input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none}
.banner{background:var(--acc-bg);border:1px solid var(--acc);border-radius:var(--r2);padding:var(--sp2) var(--sp3);margin-bottom:var(--sp3);font-size:var(--fs-s)}
.info{color:var(--tx2);font-size:var(--fs-s);margin:0 0 var(--sp3);line-height:1.45}
.card{background:var(--s1);border-radius:var(--r3);padding:var(--sp3);margin-bottom:var(--sp3);border:1px solid var(--line)}
.card.ss{border:2px solid var(--acc2)}
.sstitle{font-size:var(--fs-xs);color:var(--acc2);font-weight:800;margin-bottom:6px}
.exh{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--sp2)}
.exn{font-size:var(--fs-l);font-weight:800;line-height:1.2}
.num{display:inline-block;background:var(--acc);color:var(--on-acc);border-radius:var(--r1);padding:1px 8px;font-size:var(--fs-s);margin-right:6px;vertical-align:middle}
.presc{font-size:var(--fs-m);color:var(--acc2);font-weight:700;margin:6px 0 4px}
.small{font-size:var(--fs-xs);color:var(--tx2)}
.btns{display:flex;gap:var(--sp2);margin:10px 0 4px}
.btns button{flex:1}
.bandrow{display:flex;align-items:center;gap:var(--sp2);margin-top:10px;background:var(--s2);border-radius:var(--r2);padding:6px 10px}
.bandrow label{font-size:var(--fs-xs);color:var(--acc2);font-weight:800;white-space:nowrap}
.bandrow input{flex:1;background:transparent;border:0;min-height:40px;font-size:16px;padding:0}
.sets{display:grid;grid-template-columns:34px 1fr 1fr 54px;gap:6px;align-items:center;margin-top:var(--sp2)}
.sets .hd{font-size:var(--fs-xs);color:var(--tx2);text-align:center}
.chk{width:54px;height:48px;border-radius:var(--r2);background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:22px;border:0}
.chk.on{background:var(--ok);color:var(--on-acc)}
.sn{font-weight:800;text-align:center;color:var(--tx2)}
.exsvg{width:100%;height:auto;background:#101216;border-radius:var(--r2);margin:var(--sp2) 0;display:block}
.fl{fill:none;stroke:#f7f5f0;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}
.fh{fill:#f7f5f0}
.fb{fill:var(--acc)}
.band{fill:none;stroke:var(--ok);stroke-width:2.5;stroke-dasharray:4 3;stroke-linecap:round}
.arr{stroke:var(--acc);stroke-width:3;fill:none}
.p{fill:#3d434d}.p2{stroke:#7b8494;stroke-width:5;stroke-linecap:round;fill:none}
.floor{stroke:#4d5563;stroke-width:2}
.sep{stroke:#2c313a;stroke-width:1}
.lbl{fill:#a9aeb7;font-size:9px;font-weight:700;text-anchor:middle;letter-spacing:1px}
.mus .lbl{font-size:10px}
.lev{stroke:#7b8494;stroke-width:2;fill:none}
#modal{position:fixed;inset:0;background:var(--bg);z-index:40;overflow:auto;padding:calc(var(--sat) + var(--sp3)) var(--sp3) 40px;display:none}
#modal.on{display:block}
.mh{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:0;background:var(--bg);padding:4px 0 8px;z-index:2}
.mw{max-width:var(--maxw);margin:0 auto}
h2{font-size:var(--fs-xl);margin:0;line-height:1.15}
h3{font-size:var(--fs-xs);letter-spacing:.5px;color:var(--acc);margin:var(--sp4) 0 6px;font-weight:800;text-transform:uppercase}
ul{margin:0;padding-left:20px}li{margin-bottom:7px}
.err li{margin-bottom:10px}
.err b{color:var(--bad)}
.mus{width:100%;background:#101216;border-radius:var(--r2);display:block}
.m{fill:#3d434d}.m.p{fill:var(--acc)}.m.s{fill:#a86e26}
.mo{fill:none;stroke:#5a6270;stroke-width:2}
.yr{display:grid;grid-template-columns:repeat(13,1fr);gap:3px;margin:10px 0}
.wk{aspect-ratio:1;border-radius:4px;font-size:var(--fs-xs);display:flex;align-items:center;justify-content:center;font-weight:800;color:var(--on-acc)}
.wk.dl{outline:2px dashed #fff;outline-offset:-3px}
.wk.now{box-shadow:0 0 0 3px #fff}
.blk{border-left:10px solid;padding:var(--sp2) 10px;margin-bottom:10px;background:var(--s1);border-radius:0 var(--r2) var(--r2) 0}
.blk b{font-size:var(--fs-m)}
.blk .small{margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:var(--fs-s)}
td,th{padding:6px 4px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{color:var(--tx2);font-weight:700;font-size:var(--fs-xs)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--sp2)}
.lab{font-size:var(--fs-xs);color:var(--tx2);margin-bottom:3px}
pre{white-space:pre-wrap;background:var(--s2);padding:10px;border-radius:10px;font-size:var(--fs-xs);margin:var(--sp2) 0 0}
.status{font-size:var(--fs-xs);color:var(--tx2);margin-top:6px}
.legend{display:flex;gap:var(--sp3);font-size:var(--fs-xs);color:var(--tx2);margin-bottom:6px;flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:14px;height:14px;border-radius:3px;display:inline-block}
</style>
</head>

  <div class="top-in">

<script>
/* ---------- Données ---------- */
const FLOOR='<line x1="0" y1="140" x2="110" y2="140" class="floor"/>';
const BENCH_FLAT='<rect x="6" y="96" width="92" height="7" rx="2" class="p"/><rect x="14" y="103" width="5" height="37" class="p"/><rect x="70" y="103" width="5" height="37" class="p"/>';
const STAND={c:[[55,18,7]],l:[[[55,26],[54,80]],[[54,80],[55,110],[55,140]],[[55,140],[68,140]]]};
const SEAT='<rect x="14" y="18" width="6" height="122" class="p"/><rect x="30" y="96" width="42" height="6" class="p"/><rect x="30" y="56" width="6" height="42" class="p"/>';

const EX={
bench:{name:"Développé couché barre",equip:"Rack + barre 20 kg + banc plat roulé dans le rack",
 sets:3,reps:"6-10",rir:"2",tempo:"2-0-1",rest:150,wu:true,
 setup:["Banc plat (0°), centré sous la barre, yeux sous la barre.","Crochets : barre 5 cm au-dessus de tes bras tendus une fois allongé (tu décroches sans déserrer les omoplates).","Sécurités : 2 cm sous la barre quand elle touche ta poitrine, cage ouverte. Teste à vide.","Prise : index sur les marques de la barre (≈ 80 cm entre les mains, 1,5× largeur d'épaules). Pieds à plat, fesses collées."],
 cues:["Omoplates serrées et abaissées avant de décrocher, elles ne bougent plus.","Barre vers le bas des pectoraux, coudes à 45-60° du torse, jamais à 90°.","Touche la poitrine sans rebond, pousse vers le haut et légèrement vers les crochets.","Pieds vissés dans le sol toute la série."],
 errors:[["Coudes évasés à 90°, barre qui descend aux clavicules.","Tu le sens quand la trajectoire est parfaitement verticale au lieu d'une légère diagonale, et que l'avant de l'épaule tire."],["Fesses qui décollent ou omoplates qui se déserrent au sommet.","Tu le sens quand le haut du dos glisse sur le banc entre deux reps."]],
 prog:"S1 : retest (20×10, 30×8, 40×5, 50×3, puis 60 × max reps à RIR 1, arrêt à 12). Ensuite double progression 6→10. À 3×10 RIR 2 : +10 kg et repars à 3×6. Si +10 kg ne passe pas 3×5 : ajoute une 4e série à l'ancienne charge 2 semaines, puis retente.",
 mus:{p:["chest","triceps"],s:["delt"]},
 props:BENCH_FLAT+FLOOR,
 start:{c:[[22,84,7]],l:[[[35,88],[72,90]],[[72,90],[88,108],[92,140]],[[92,140],[104,140]],[[35,88],[40,70],[42,52]]],b:[[42,50,6]],a:[[52,54],[52,78]]},
 end:{c:[[22,84,7]],l:[[[35,88],[72,90]],[[72,90],[88,108],[92,140]],[[92,140],[104,140]],[[35,88],[46,102],[40,84]]],b:[[40,82,6]]}},

pullup_band:{name:"Tractions assistées (élastique)",equip:"Barre du rack + élastique de la boîte",
 band:true,wl:"+kg",
 sets:4,reps:"5-8",rir:"2",tempo:"1-1-2",rest:120,
 setup:["Élastique épais passé autour de la barre, boucle sous UN genou (plus stable et moins d'aide en haut que sous le pied).","Prise pronation, un peu plus large que les épaules, pouces autour de la barre.","Jambes fléchies, pieds croisés, regard légèrement vers le haut."],
 cues:["Départ bras tendus, épaules décollées des oreilles avant de tirer.","Tire les coudes vers les hanches, pense « poitrine vers la barre ».","Menton au-dessus de la barre 1 s, descente contrôlée en 2 s jusqu'aux bras tendus."],
 errors:[["Amplitude coupée en bas (bras jamais tendus).","Tu le sens quand tu n'as jamais d'étirement sous les aisselles entre deux reps."],["Balancement des jambes pour lancer la rep.","Tu le sens quand le torse oscille et que les hanches partent devant."]],

const KEY='muscu_bloc1_v1';
let state={view:'today',week:1,day:'lun',start:'2026-09-14',logs:{},refs:{},pinned:false};
function curWeek(){const st=new Date(state.start+'T00:00:00');if(isNaN(st))return 1;
  const w=Math.floor((new Date()-st)/(7*864e5))+1;return Math.min(52,Math.max(1,w));}
function blockOf(w){return BLOCKS.find(b=>w>=b.w[0]&&w<=b.w[1])||BLOCKS[0];}
function syncWeek(){if(!state.pinned)state.week=curWeek();}
/* Hors artifact Claude (ex. GitHub Pages) : repli sur localStorage */
if(!window.storage){try{const ls=window.localStorage;ls.setItem('__t','1');ls.removeItem('__t');window.storage={get:async k=>({value:ls.getItem(k)}),set:async(k,v)=>{ls.setItem(k,v);}};}catch(e){}}
let hasStorage=false,saveT=null;
async function load(){
  if(!window.storage){return;}
  hasStorage=true;
  try{const r=await window.storage.get(KEY,false);if(r&&r.value){const s=JSON.parse(r.value);Object.assign(state,s);}}catch(e){}
}
function save(){
  if(!hasStorage)return;
  clearTimeout(saveT);
  saveT=setTimeout(async()=>{try{await window.storage.set(KEY,JSON.stringify(state),false);setStatus('Sauvegardé');}catch(e){setStatus('Sauvegarde impossible : exporte en fin de séance');}},400);
}
function setStatus(t){const el=document.getElementById('status');if(el)el.textContent=t;}
function lk(ex,i){return state.week+'|'+state.day+'|'+ex+'|'+i;}
function getSet(ex,i){return state.logs[lk(ex,i)]||{};}
function setField(ex,i,f,v){const k=lk(ex,i);state.logs[k]=Object.assign({},state.logs[k]||{},{[f]:v});save();}

function fig(p){
  let s='';
  (p.l||[]).forEach(l=>s+=`<polyline points="${l.map(q=>q.join(',')).join(' ')}" class="fl"/>`);
  (p.c||[]).forEach(c=>s+=`<circle cx="${c[0]}" cy="${c[1]}" r="${c[2]}" class="fh"/>`);
  (p.b||[]).forEach(b=>s+=`<circle cx="${b[0]}" cy="${b[1]}" r="${b[2]||5}" class="fb"/>`);
  (p.d||[]).forEach(d=>s+=`<polyline points="${d.map(q=>q.join(',')).join(' ')}" class="band"/>`);
  if(p.a)s+=`<line x1="${p.a[0][0]}" y1="${p.a[0][1]}" x2="${p.a[1][0]}" y2="${p.a[1][1]}" class="arr" marker-end="url(#ah)"/>`;

}

/* ---------- Vues ---------- */
const VIEWS=['today','year','prog'],scrollY0={};
const $=id=>document.getElementById(id);
function go(v){
  if(v===state.view){window.scrollTo({top:0,behavior:'smooth'});return;}
  scrollY0[state.view]=window.scrollY;
  state.view=v;save();render();
  window.scrollTo(0,scrollY0[v]||0);
}
/* Rendu complet de la vue active : seulement à la navigation ou au changement de jour/semaine */
function render(){
  syncWeek();
  VIEWS.forEach(v=>{const on=state.view===v;$('v-'+v).hidden=!on;
    const t=$('tab-'+v);if(on)t.setAttribute('aria-current','page');else t.removeAttribute('aria-current');});
  const bh=blockOf(state.week);
  document.documentElement.style.setProperty('--blk',bh.color);
  $('v-'+state.view).innerHTML=state.view==='today'?vToday():state.view==='year'?vYear():vProg();
  renderHead();
}
function renderHead(){
  const bh=blockOf(state.week);
  $('hWeek').textContent='Semaine '+state.week;
  $('hBlockTxt').textContent=`Bloc ${bh.n} · ${bh.name}`;
  const p=sessProgress();
  $('hProgTxt').textContent=p.done+'/'+p.total;
  $('hProg').setAttribute('aria-label',`${p.done} séries faites sur ${p.total}`);
  $('hBar').style.transform=`scaleX(${p.total?p.done/p.total:0})`;
}
/* Séries prévues et faites pour la séance affichée (semaine + jour) */
function sessProgress(){
  const items=PLAN[blockOf(state.week).n][state.day];let total=0,done=0;
  items.forEach(it=>(it.ss||[it]).forEach(x=>{const ex=typeof x==='string'?x:x.ex;
    const m=Object.assign({},EX[ex],typeof x==='string'?{}:x);
    const n=DELOADS.includes(state.week)?Math.max(1,Math.ceil(m.sets/2)):m.sets;
    total+=n;for(let i=0;i<n;i++)if(getSet(ex,i).ok)done++;}));
  return {done,total};
}
/* Le contenu réserve sous lui la hauteur réelle du dock (minuteur + onglets + zone d'accueil iOS) */
new ResizeObserver(([e])=>document.documentElement.style.setProperty('--dock-h',Math.ceil(e.target.getBoundingClientRect().height)+'px')).observe($('dock'));
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}
function presc(e){return `${e.sets} × ${e.reps} · RIR ${e.rir} · tempo ${e.tempo}`+(e.rest?` · repos ${fmt(e.rest)}`:'');}
function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0');}

let CUR={};
function merged(it){
  const ex=typeof it==='string'?it:it.ex;
  const m=Object.assign({},EX[ex],typeof it==='string'?{}:it);
  if(DELOADS.includes(state.week)){m.sets=Math.max(1,Math.ceil(m.sets/2));m.rir="4";m.deload=true;}
  CUR[ex]=m;return m;
}
function setRows(ex){
  const e=CUR[ex]||EX[ex];let h='';
  if(e.band){const b=getSet(ex,'b');
    h+=`<div class="bandrow"><label for="bd-${ex}">Élastique</label><input id="bd-${ex}" type="text" value="${esc(b.v??'')}" placeholder="ex. noir épais, 30-60 kg" oninput="setField('${ex}','b','v',this.value)"></div>`;}
  h+=`<div class="sets"><div class="hd">#</div><div class="hd">${e.wl||'kg'}</div><div class="hd">reps</div><div class="hd">fait</div>`;
  for(let i=0;i<e.sets;i++){
    const s=getSet(ex,i);
    h+=`<div class="sn">${i+1}</div>
<input type="number" inputmode="decimal" placeholder="kg" value="${s.w??''}" oninput="setField('${ex}',${i},'w',this.value)" aria-label="charge série ${i+1}">
<input type="number" inputmode="numeric" placeholder="reps" value="${s.r??''}" oninput="setField('${ex}',${i},'r',this.value)" aria-label="reps série ${i+1}">
<button class="chk ${s.ok?'on':''}" onclick="toggle('${ex}',${i},this)" aria-label="série ${i+1} faite">${s.ok?'✓':''}</button>`;
  }
  return h+'</div>';
}
function toggle(ex,i,btn){const s=getSet(ex,i);setField(ex,i,'ok',!s.ok);btn.classList.toggle('on',!s.ok);btn.textContent=!s.ok?'✓':'';renderHead();}

function exCard(it,n){
  const e=merged(it),ex=e.ex||(typeof it==='string'?it:it.ex);
  return `<div class="exh"><div class="exn">${n?`<span class="num">${n}</span>`:''}${esc(e.name)}</div></div>
<div class="presc">${presc(e)}${e.deload?' <span style="color:#4fd39c">· décharge</span>':''}</div>
<div class="small">${esc(e.equip)}</div>
<div class="btns"><button onclick="openEx('${ex}')">Fiche</button>${e.rest?`<button class="acc" onclick="startTimer(${e.rest},'${esc(e.name)}')">Repos ${fmt(e.rest)}</button>`:''}</div>
${setRows(ex)}`;
}
function vToday(){
  const s=SESS[state.day],b=blockOf(state.week);
  let h=`<div class="days">${Object.keys(SESS).map(d=>`<button class="${state.day===d?'on':''}" onclick="state.day='${d}';save();render()">${SESS[d].label}<small>${SESS[d].sub}</small></button>`).join('')}</div>`;
  let opts='';
  BLOCKS.forEach(b=>{opts+=`<optgroup label="Bloc ${b.n} — ${b.name}">`;
    for(let w=b.w[0];w<=b.w[1];w++)opts+=`<option value="${w}" ${state.week===w?'selected':''}>Semaine ${w}${w===1?' (retest)':''}${DELOADS.includes(w)?' (décharge)':''}</option>`;
    opts+='</optgroup>';});
  h+=`<div class="row"><label for="wk" class="small">Semaine</label><select id="wk" onchange="state.week=+this.value;state.pinned=true;save();render()">${opts}</select>${state.pinned&&state.week!==curWeek()?`<button onclick="state.pinned=false;syncWeek();save();render()">Auj.</button>`:''}</div>
<div class="row"><span class="status" id="status">${hasStorage?'Sauvegarde automatique':'Pas de stockage : exporte en fin de séance'}</span></div>`;
  const plan=PLAN[b.n],items=plan[state.day];
  CUR={};
  h+=`<div class="banner" style="border-color:${b.color}">Bloc ${b.n} — <b>${b.name}</b> · semaines ${b.w[0]} à ${b.w[1]} · RIR ${b.rir}${state.pinned&&state.week!==curWeek()?` · <b>semaine figée</b>, aujourd'hui c'est la ${curWeek()}`:''}</div>`;
  h+=`<p class="info" style="margin-bottom:12px">${esc(plan.note)}</p>`;
  if(state.week===1)h+=`<div class="banner">Semaine de retest : développé couché lundi, squat technique mardi (goblet + barre à vide), soulevé de terre jeudi. Le retest remplace les séries de travail du 1er exercice.</div>`;
  if(DELOADS.includes(state.week))h+=`<div class="banner">Décharge : les séries sont déjà divisées par deux ci-dessous et le RIR passé à 4. Enlève 15 % de charge sur tout. Même durée, même ordre, tu sors frais.</div>`;
  const nser=items.reduce((a,it)=>a+(it.ss?2:1),0);
  h+=`<p class="info"><b>${s.label} — ${s.sub}, 45 min chrono.</b> ${esc(s.wu)}<br><b>Chrono :</b> ${items.length} postes, ${nser} exercices. Échauffement jusqu'à 4 min, puis environ ${Math.round(41/items.length)} min par poste. Tu dois avoir fini le poste 2 à la moitié du temps.</p>`;
  let n=0;
  items.forEach(it=>{
    n++;
    if(it.ss){h+=`<div class="card ss"><div class="sstitle">Superset : enchaîne A1 puis A2 sans repos, puis ${fmt(it.rest)} de repos</div><div>${exCard(it.ss[0],n+'·A1')}</div><hr style="border:0;border-top:1px solid var(--line);margin:12px 0"><div>${exCard(it.ss[1],n+'·A2')}</div></div>`;}
    else{h+=`<div class="card">${exCard(it,n)}</div>`;}
  });
  h+=`<div class="card"><div class="exn">Fin de séance</div><p class="small">Ton texte à coller dans tes notes. Il reprend toutes les semaines saisies.</p><div class="btns"><button class="acc" onclick="exportTxt()">Copier le journal</button><button onclick="resetWeek()">Effacer cette séance</button></div><pre id="exp" style="display:none"></pre></div>`;
  return h;
}
function resetWeek(){
  if(!confirm('Effacer les saisies de la semaine '+state.week+' pour '+SESS[state.day].label+' ?'))return;
  const pre=state.week+'|'+state.day+'|';
  Object.keys(state.logs).forEach(k=>{if(k.startsWith(pre))delete state.logs[k];});
  save();render();
}
function exportTxt(){
  const lines=[];
  const keys=Object.keys(state.logs).sort((a,b)=>{const A=a.split('|'),B=b.split('|');return (+A[0]-+B[0])||A[1].localeCompare(B[1])||A[2].localeCompare(B[2])||(+A[3]-+B[3]);});
  const grp={};
  const bands={};
  keys.forEach(k=>{const [w,d,ex,i]=k.split('|');const g=w+'|'+d+'|'+ex;
    if(i==='b'){bands[g]=state.logs[k].v;return;}
    (grp[g]=grp[g]||[])[+i]=state.logs[k];});
  Object.keys(grp).forEach(g=>{const [w,d,ex]=g.split('|');
    const sets=grp[g].map(s=>s?`${s.w||'—'}×${s.r||'—'}${s.ok?'✓':''}`:'—');
    lines.push(`S${w} ${SESS[d].label} – ${EX[ex].name}${bands[g]?` [élastique ${bands[g]}]`:''} : ${sets.join(', ')}`);});
  if(state.refs&&Object.keys(state.refs).length)lines.push('Références : '+JSON.stringify(state.refs));
  const txt=lines.join('\n')||'Aucune saisie.';
  const pre=document.getElementById('exp');pre.style.display='block';pre.textContent=txt;
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(()=>setStatus('Journal copié')).catch(()=>{});}
}

function vYear(){
  const cur=curWeek(),inYear=true,blk=blockOf;
  let h=`<div class="row"><label for="st" class="small">Début (lundi)</label><input id="st" type="date" value="${state.start}" onchange="state.start=this.value;save();render()"></div>`;
  h+=`<div class="banner">${inYear?`Semaine <b>${cur}</b> sur 52 — bloc ${blk(cur).n}, ${blk(cur).name}${DELOADS.includes(cur)?' — <b>décharge</b>':''}`:(cur<1?`Le programme démarre dans ${1-cur} semaine(s)`:'Année terminée : retest complet et nouveau cycle')}</div>`;
  h+=`<div class="legend"><span><span class="sw" style="outline:2px dashed #fff;outline-offset:-2px;background:#555"></span> décharge</span><span><span class="sw" style="box-shadow:0 0 0 2px #fff;background:#555"></span> aujourd'hui</span></div><div class="yr">`;
  for(let w=1;w<=52;w++){const b=blk(w);h+=`<div class="wk ${DELOADS.includes(w)?'dl':''} ${w===cur?'now':''}" style="background:${b.color}" title="Semaine ${w}">${w}</div>`;}
  h+='</div>';
  BLOCKS.forEach(b=>{h+=`<div class="blk" style="border-color:${b.color}"><b>Bloc ${b.n} — ${b.name}</b><div class="small">Semaines ${b.w[0]} à ${b.w[1]} · RIR ${b.rir} · décharge S${b.w[1]}</div><div style="font-size:16px;margin-top:4px">${b.obj}</div></div>`;});
  return h;
}

function refIn(id,lab,ph){return `<div><div class="lab">${lab}</div><input type="text" placeholder="${ph}" value="${esc(state.refs[id]||'')}" oninput="state.refs['${id}']=this.value;save()"></div>`;}
function vProg(){
  let h=`<p class="info">Tes charges de référence après la semaine de retest. Tout le reste du bloc part de là.</p><div class="grid2">`;
  h+=refIn('bench','Développé couché (kg × reps)','kg × reps')+refIn('squat','Squat (kg × reps)','kg × reps')+refIn('dl','Soulevé de terre (meilleur single)','kg')+refIn('pull','Tractions strictes (total 3 séries)','a+b+c')+refIn('bw','Poids du corps (kg, moy. semaine)','kg')+refIn('waist','Tour de taille au nombril (cm)','cm');
  h+=`</div><h3>Paliers visés, bloc par bloc</h3><p class="small">Cibles indicatives : fin de bloc, dernière série de travail à RIR 1-2. Elles supposent que le poids monte (colonne du bas).</p><div style="overflow-x:auto"><table><tr><th>Mouvement</th>${BLOCKS.map(b=>`<th style="color:${b.color}">B${b.n}</th>`).join('')}</tr>`;
  TARGETS.forEach(r=>{h+=`<tr><td><b>${r[0]}</b></td>${r.slice(1).map(c=>`<td>${c}</td>`).join('')}</tr>`;});
  h+=`</table></div><h3>Règle d'or</h3><ul><li>Une charge ne monte que si toutes les séries ont atteint le haut de la fourchette au RIR demandé.</li><li>Quand +10 kg est trop lourd : 4e série à l'ancienne charge pendant 2 semaines, puis retente.</li><li>À 18 kg d'haltères : reps → tempo → pause → 1,5 reps → variante barre. Dans cet ordre.</li></ul>`;
  return h;
}

/* ---------- Fiche exercice ---------- */
function openEx(ex){
  const e=CUR[ex]||EX[ex];
  document.getElementById('mbody').innerHTML=`<div class="mh"><h2>${esc(e.name)}</h2><button class="acc" onclick="closeEx()">Fermer</button></div>
${exSvg(e)}
<div class="presc">${presc(e)}</div>
<h3>Réglages du matériel</h3><ul>${e.setup.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
<h3>Exécution</h3><ul>${e.cues.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>
<h3>Les 2 erreurs à traquer</h3><ul class="err">${e.errors.map(x=>`<li><b>${esc(x[0])}</b><br>${esc(x[1])}</li>`).join('')}</ul>
<h3>Progression dans ce bloc</h3><p style="margin:0">${esc(e.prog)}</p>
<h3>Muscles travaillés</h3>${musSvg(e.mus)}
<div class="legend" style="margin-top:6px"><span><span class="sw" style="background:var(--acc)"></span> principal</span><span><span class="sw" style="background:#a86e26"></span> secondaire</span></div>
${e.rest?`<div class="btns" style="margin-top:16px"><button class="acc" onclick="startTimer(${e.rest},'${esc(e.name)}');closeEx()">Lancer le repos ${fmt(e.rest)}</button></div>`:''}`;
  document.getElementById('modal').classList.add('on');document.getElementById('modal').scrollTop=0;
}
function closeEx(){document.getElementById('modal').classList.remove('on');}

/* ---------- Minuteur ---------- */
let tEnd=0,tInt=null,tLabel='';
function startTimer(sec,label){
  tEnd=Date.now()+sec*1000;tLabel=label;
  const box=document.getElementById('timer');box.classList.remove('done');box.classList.add('run');
  document.getElementById('tl').textContent='Repos : '+label;
  clearInterval(tInt);tick();tInt=setInterval(tick,250);
}
function addTimer(s){if(tEnd>Date.now()){tEnd+=s*1000;tick();}}
function stopTimer(){clearInterval(tInt);tEnd=0;const box=document.getElementById('timer');box.classList.remove('run','done');document.getElementById('tt').textContent='—';document.getElementById('tl').textContent='Minuteur de repos';}
function tick(){
  const left=Math.max(0,Math.ceil((tEnd-Date.now())/1000));
  document.getElementById('tt').textContent=fmt(left);
  if(left<=0){clearInterval(tInt);const box=document.getElementById('timer');box.classList.remove('run');box.classList.add('done');document.getElementById('tl').textContent='Repos terminé : série suivante';
    if(navigator.vibrate)navigator.vibrate([300,150,300]);beep();}
}
function beep(){try{const A=new (window.AudioContext||window.webkitAudioContext)();const o=A.createOscillator(),g=A.createGain();o.connect(g);g.connect(A.destination);o.frequency.value=880;g.gain.value=.15;o.start();o.stop(A.currentTime+.35);}catch(e){}}

/* ---------- Démarrage ---------- */
(async()=>{await load();state.view=state.view||'today';render();})();
</script>
